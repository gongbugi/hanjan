[project]
name = "hanjan"
version = "0.1.0"
description = "hanjan (한 잔) — AI hand-drip coffee log backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "httpx>=0.27",
  "google-genai>=1.0",
  "google-auth>=2.30",
  "requests>=2.32",
  "tzdata>=2024.1",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# 운영 이미지에만 넣는다. 테스트는 FakeEmbedder로 돈다.
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hanjan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
  "db: Postgres + pgvector가 필요하다 (HANJAN_TEST_DATABASE_URL)",
  "slow: 실제 임베딩 모델을 내려받는다",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP046: pydantic 제네릭 모델은 TypeVar 문법을 유지한다
# E501: 한글은 폭 2로 세져서 메시지·프롬프트 줄이 기계적으로 걸린다 — 줄 길이는 포매터에 맡긴다
ignore = ["UP046", "E501"]

[tool.ruff.lint.isort]
# 레포에 alembic/ 폴더가 있어서 ruff가 alembic 패키지를 1st-party로 오인한다
known-third-party = ["alembic"]
known-first-party = ["hanjan"]
