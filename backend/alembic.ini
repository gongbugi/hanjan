# Keep this file ASCII-only: on Windows, configparser reads it with the locale
# encoding (cp949) and non-ASCII comments raise UnicodeDecodeError.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally empty: env.py reads HANJAN_DATABASE_URL
# (tests override it through alembic.config.Config).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
